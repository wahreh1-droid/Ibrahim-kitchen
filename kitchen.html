<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جامعہ دارالعلوم عیدگاہ — باورچی خانہ کا حساب</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --g900: #1a2e1f;
  --g800: #1f3a26;
  --g700: #245230;
  --g600: #2d6b3c;
  --g500: #3a8a4e;
  --g400: #4eaa64;
  --g100: #e8f5eb;
  --g50:  #f2faf4;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --red: #b91c1c;
  --red-bg: #fee2e2;
  --ink9: #111827;
  --ink7: #374151;
  --ink5: #6b7280;
  --ink3: #d1d5db;
  --ink1: #f3f4f6;
  --ink0: #f9fafb;
  --sur: #ffffff;
  --bdr: #e5e7eb;
  --ur: 'Noto Nastaliq Urdu', serif;
  --mono: 'IBM Plex Mono', monospace;
  --en: 'Inter', sans-serif;
  --r: 6px;
  --rl: 10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--en);background:var(--ink1);color:var(--ink9);min-height:100vh;direction:rtl}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input{font-family:inherit}
a{text-decoration:none}

/* MASTHEAD */
.mast{
  background:var(--g700);color:#fff;
  padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;
  min-height:88px;gap:24px;
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.2);
}
.mast-right{text-align:right;flex-shrink:0}
.inst-ur{font-family:var(--ur);font-size:1.8rem;font-weight:700;line-height:1.3}
.inst-sub{font-family:var(--en);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:2px}

.mast-center{display:flex;align-items:center;gap:14px;flex:1;justify-content:center}
.nav-btn{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.15);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;transition:background .15s;flex-shrink:0;
}
.nav-btn:hover{background:rgba(255,255,255,.28)}

.date-block{text-align:center;cursor:pointer;position:relative;user-select:none}
.date-greg{
  font-family:var(--mono);font-size:2rem;font-weight:600;
  letter-spacing:.04em;line-height:1;color:#fff;
}
.date-greg span{opacity:.45;font-weight:400;margin:0 4px}
.date-dow{font-family:var(--en);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:3px}
.hijri-wrap{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:3px}
.hijri-val{
  font-family:var(--ur);font-size:.85rem;opacity:.78;
  border-bottom:1px dashed rgba(255,255,255,.35);padding-bottom:1px;
  cursor:pointer;transition:opacity .15s;
}
.hijri-val:hover{opacity:1;border-color:rgba(255,255,255,.7)}
.hijri-suffix{font-size:.65rem;opacity:.4;color:#fff}
#date-picker{position:absolute;opacity:0;width:0;height:0;top:0;left:50%}

.mast-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex-shrink:0}
.stu-label{font-family:var(--en);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.5}
.stu-input{
  font-family:var(--mono);font-size:1.1rem;font-weight:600;
  color:#fff;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);border-radius:var(--r);
  padding:5px 10px;width:110px;text-align:center;
}
.stu-input:focus{outline:none;background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}

/* TABS */
.tabs-bar{
  background:var(--sur);border-bottom:2px solid var(--bdr);
  padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:88px;z-index:90;
}
.tabs-nav{display:flex;direction:rtl}
.tab-btn{
  font-family:var(--ur);font-size:.95rem;
  padding:14px 22px;color:var(--ink5);
  border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color .15s,border-color .15s;white-space:nowrap;
}
.tab-btn:hover{color:var(--g600)}
.tab-btn.active{color:var(--g700);border-bottom-color:var(--g700);font-weight:600}
.tab-en{font-family:var(--en);font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;display:block;opacity:.55;margin-top:1px}

/* STATS */
.stats{
  background:var(--sur);border-bottom:1px solid var(--bdr);
  padding:11px 28px;display:flex;align-items:center;gap:28px;direction:ltr;
}
.stat-val{font-family:var(--mono);font-size:1.12rem;font-weight:600;color:var(--ink9)}
.stat-lbl{font-family:var(--en);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink5);margin-top:1px}
.stat-div{width:1px;height:30px;background:var(--bdr)}

/* TOOLBAR */
.toolbar{
  padding:11px 28px;display:flex;align-items:center;justify-content:space-between;
  background:var(--ink0);border-bottom:1px solid var(--bdr);
}
.block-sel{display:flex;align-items:center;gap:8px;direction:rtl}
.blk-lbl{font-family:var(--en);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink5);margin-left:4px}
.blk-btn{
  font-family:var(--ur);font-size:.9rem;
  padding:7px 18px;border-radius:var(--r);
  border:1.5px solid var(--bdr);background:var(--sur);color:var(--ink7);
  transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:1px;
}
.blk-en{font-family:var(--en);font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;opacity:.5}
.blk-btn:hover{border-color:var(--g500);color:var(--g700)}
.blk-btn.active{background:var(--g700);border-color:var(--g700);color:#fff}
.blk-btn.active .blk-en{opacity:.7}
.add-btn{
  font-family:var(--ur);font-size:.9rem;
  padding:7px 16px;border-radius:var(--r);
  border:1.5px dashed var(--g500);color:var(--g700);background:var(--g50);
  display:flex;align-items:center;gap:6px;transition:all .15s;
}
.add-btn:hover{background:var(--g100);border-color:var(--g700)}
.plus{font-size:1.1rem;font-weight:300}

/* TABLE */
.tbl-wrap{overflow-x:auto;background:var(--sur)}
table{width:100%;border-collapse:collapse;direction:rtl;min-width:960px}
thead th{
  font-family:var(--en);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink5);padding:9px 13px;text-align:right;
  border-bottom:2px solid var(--bdr);background:var(--ink0);white-space:nowrap;
}
th.gh{text-align:center;border-bottom:1px solid var(--bdr);padding-bottom:3px}
tr.sh th{padding-top:3px;border-bottom:2px solid var(--bdr)}
th.ci{min-width:140px}
th.cu{text-align:center;width:60px}
th.cn{text-align:center;width:88px}
th.cr{min-width:150px}
th.sep-l{border-left:1px solid var(--bdr)}
th.sep-r{border-right:1px solid var(--bdr)}

tbody tr{border-bottom:1px solid var(--bdr);transition:background .1s}
tbody tr:hover{background:var(--ink0)}
tbody tr.ls{background:#fffbeb}
tbody tr.ls:hover{background:#fef3c7}

td{padding:9px 13px;vertical-align:middle}
td.ci{text-align:right}
td.cu{text-align:center}
td.cn{text-align:center}

.iur{font-family:var(--ur);font-size:1rem;color:var(--ink9);display:block;line-height:1.4}
.ien{font-family:var(--en);font-size:.68rem;color:var(--ink5);display:block}
.ubadge{
  font-family:var(--mono);font-size:.68rem;
  background:var(--ink1);color:var(--ink5);
  border-radius:4px;padding:2px 6px;display:inline-block;text-transform:uppercase;
}
.nv{font-family:var(--mono);font-size:.9rem;color:var(--ink7);display:block;text-align:center}
.np{font-family:var(--mono);font-size:.68rem;color:var(--ink5);display:block;text-align:center;margin-top:1px}

.qi{
  font-family:var(--mono);font-size:.9rem;color:var(--ink9);
  width:80px;text-align:center;
  border:1.5px solid var(--bdr);border-radius:var(--r);
  padding:5px 6px;background:var(--sur);
  transition:border-color .15s,box-shadow .15s;
  display:block;margin:0 auto;
}
.qi:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px rgba(58,138,78,.1)}
.qi.chg{border-color:var(--g500);background:var(--g50)}
.vi{
  font-family:var(--mono);font-size:.78rem;color:var(--ink7);
  width:80px;text-align:center;
  border:1.5px solid var(--bdr);border-radius:var(--r);
  padding:4px 6px;background:var(--ink0);
  transition:border-color .15s;
  display:block;margin:2px auto 0;
}
.vi:focus{outline:none;border-color:var(--g400)}

.rem-cell{text-align:right;direction:ltr}
.rem-qty{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--ink9)}
.rem-unit{font-family:var(--en);font-size:.68rem;color:var(--ink5);margin-right:3px}
.pb-wrap{width:118px;height:4px;background:var(--bdr);border-radius:2px;margin-top:5px;overflow:hidden}
.pb-fill{height:100%;border-radius:2px;background:var(--g500);transition:width .3s}
.pb-fill.med{background:var(--amber)}
.pb-fill.low{background:var(--red)}
.ls-badge{
  font-family:var(--ur);font-size:.68rem;
  background:var(--amber-bg);color:var(--amber);
  border-radius:3px;padding:1px 5px;display:inline-block;margin-top:3px;
}

tfoot td{
  background:var(--ink0);border-top:2px solid var(--bdr);
  font-family:var(--mono);font-size:.88rem;font-weight:600;padding:11px 13px;
}
.tot-lbl{font-family:var(--ur);font-size:.95rem;color:var(--ink7);text-align:right}

/* FOOTER */
.foot{
  position:sticky;bottom:0;background:var(--sur);
  border-top:1px solid var(--bdr);
  padding:11px 28px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:90;direction:rtl;
}
.as-note{font-family:var(--en);font-size:.68rem;color:var(--ink5);display:flex;align-items:center;gap:5px}
.as-dot{width:6px;height:6px;border-radius:50%;background:var(--g500);flex-shrink:0}
.foot-acts{display:flex;align-items:center;gap:10px;direction:ltr}
.btn-ghost{
  font-family:var(--ur);font-size:.87rem;
  padding:8px 16px;border-radius:var(--r);
  border:1.5px solid var(--bdr);color:var(--ink7);background:var(--sur);
  transition:all .15s;display:flex;align-items:center;gap:6px;
}
.btn-ghost:hover{border-color:var(--ink5);background:var(--ink0)}
.en-lbl{font-family:var(--en);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;opacity:.65}
.btn-pri{
  font-family:var(--ur);font-size:.95rem;font-weight:600;
  padding:9px 24px;border-radius:var(--r);
  background:var(--g700);color:#fff;
  transition:background .15s,transform .1s;
  display:flex;align-items:center;gap:7px;
}
.btn-pri:hover{background:var(--g600)}
.btn-pri:active{transform:scale(.98)}
.btn-pri:disabled{background:var(--ink3);cursor:not-allowed}

/* CREATE DAY */
.cday{
  margin:40px auto;max-width:500px;
  background:var(--sur);border:2px dashed var(--bdr);
  border-radius:var(--rl);padding:44px 32px;text-align:center;direction:rtl;
}
.cday h2{font-family:var(--ur);font-size:1.3rem;color:var(--ink7);margin-bottom:8px}
.cday p{font-family:var(--en);font-size:.82rem;color:var(--ink5);margin-bottom:24px}
.cday-form{display:flex;flex-direction:column;gap:12px}
.cday-form input{
  font-family:var(--en);font-size:.92rem;
  border:1.5px solid var(--bdr);border-radius:var(--r);
  padding:9px 12px;text-align:center;direction:ltr;width:100%;
}
.cday-form input:focus{outline:none;border-color:var(--g500)}

/* MODAL - ADD ITEM */
.ov{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  z-index:200;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.ov.open{opacity:1;pointer-events:all}
.modal{
  background:var(--sur);border-radius:var(--rl);
  width:480px;max-width:calc(100vw - 32px);
  box-shadow:0 8px 32px rgba(0,0,0,.16);overflow:hidden;
  transform:translateY(14px);transition:transform .2s;direction:rtl;
}
.ov.open .modal{transform:translateY(0)}
.mhdr{
  background:var(--g700);color:#fff;
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;
}
.mtitle-ur{font-family:var(--ur);font-size:1.1rem;font-weight:700}
.mtitle-en{font-family:var(--en);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-top:2px}
.mclose{color:rgba(255,255,255,.65);font-size:1.4rem;line-height:1;transition:color .15s}
.mclose:hover{color:#fff}
.mbody{padding:20px}
.fg{margin-bottom:18px}
.flbl{
  font-family:var(--en);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink5);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;
}
.flbl-ur{font-family:var(--ur);font-size:.85rem;color:var(--ink7);letter-spacing:0;text-transform:none}
.finp{
  width:100%;border:1.5px solid var(--bdr);border-radius:var(--r);
  padding:9px 12px;font-family:var(--ur);font-size:1rem;color:var(--ink9);
  background:var(--sur);transition:border-color .15s,box-shadow .15s;text-align:right;
}
.finp:focus{outline:none;border-color:var(--g500);box-shadow:0 0 0 3px rgba(58,138,78,.1)}
.finp.ltr{font-family:var(--en);font-size:.92rem;text-align:left;direction:ltr}
.auto-tag{
  font-family:var(--en);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--g600);margin-top:4px;display:none;
}
.unit-tog{display:flex;gap:8px;direction:ltr}
.uopt{
  flex:1;padding:8px;border:1.5px solid var(--bdr);border-radius:var(--r);
  font-family:var(--mono);font-size:.8rem;text-align:center;color:var(--ink7);transition:all .15s;
}
.uopt:hover{border-color:var(--g500);color:var(--g700)}
.uopt.sel{background:var(--g700);border-color:var(--g700);color:#fff}
.mfoot{
  padding:16px 20px;border-top:1px solid var(--bdr);
  display:flex;gap:10px;justify-content:flex-start;direction:rtl;
}
.btn-cancel{
  font-family:var(--ur);font-size:.9rem;padding:8px 20px;border-radius:var(--r);
  border:1.5px solid var(--bdr);color:var(--ink7);background:var(--sur);transition:all .15s;
}
.btn-cancel:hover{background:var(--ink0)}

/* HIJRI MODAL */
.hov{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:300;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .15s;
}
.hov.open{opacity:1;pointer-events:all}
.hbox{
  background:var(--sur);border-radius:var(--rl);padding:24px;
  width:320px;box-shadow:0 8px 32px rgba(0,0,0,.16);direction:rtl;
}
.hbox h3{font-family:var(--ur);font-size:1rem;margin-bottom:12px;color:var(--ink9)}
.hbox input{
  width:100%;font-family:var(--ur);font-size:1rem;
  border:1.5px solid var(--bdr);border-radius:var(--r);
  padding:8px 12px;text-align:right;margin-bottom:14px;
}
.hbox input:focus{outline:none;border-color:var(--g500)}
.h-acts{display:flex;gap:8px;direction:rtl}

/* STATE */
.smsg{padding:60px 28px;text-align:center;color:var(--ink5);font-family:var(--en);font-size:.9rem}
.spin{
  width:28px;height:28px;border:3px solid var(--bdr);border-top-color:var(--g600);
  border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 14px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* TOAST */
#toast{
  position:fixed;bottom:72px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink9);color:#fff;
  font-family:var(--ur);font-size:.9rem;
  padding:10px 22px;border-radius:99px;
  z-index:999;opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- MASTHEAD -->
<header class="mast">
  <div class="mast-right">
    <div class="inst-ur">جامعہ دارالعلوم عیدگاہ</div>
    <div class="inst-sub">Kitchen Ledger · Kabirwala</div>
  </div>

  <div class="mast-center">
    <button class="nav-btn" id="btn-prev">&#8250;</button>
    <div class="date-block" id="date-block">
      <div class="date-greg">
        <span id="dd">17</span><span>/</span><span id="dm">08</span><span>/</span><span id="dy">2026</span>
      </div>
      <div class="date-dow" id="ddow">MONDAY · پیر</div>
      <div class="hijri-wrap">
        <span class="hijri-val" id="hijri-disp" title="تبدیل کریں">—</span>
        <span class="hijri-suffix">ھ</span>
      </div>
      <input type="date" id="date-picker">
    </div>
    <button class="nav-btn" id="btn-next">&#8249;</button>
  </div>

  <div class="mast-left">
    <div class="stu-label">Students Fed / طلبہ</div>
    <input type="number" class="stu-input" id="stu-inp" placeholder="0" min="0" max="9999">
  </div>
</header>

<!-- TABS -->
<div class="tabs-bar">
  <nav class="tabs-nav">
    <button class="tab-btn active" data-tab="kitchen">
      روزانہ باورچی خانہ
      <span class="tab-en">Daily Kitchen</span>
    </button>
    <button class="tab-btn" data-tab="qurbani">
      قربانی و عطیات
      <span class="tab-en">Qurbani &amp; Donations</span>
    </button>
  </nav>
</div>

<!-- STATS -->
<div class="stats">
  <div><div class="stat-val" id="s-items">—</div><div class="stat-lbl">Items</div></div>
  <div class="stat-div"></div>
  <div><div class="stat-val" id="s-recv">—</div><div class="stat-lbl">Received PKR</div></div>
  <div class="stat-div"></div>
  <div><div class="stat-val" id="s-used">—</div><div class="stat-lbl">Consumed PKR</div></div>
  <div class="stat-div"></div>
  <div><div class="stat-val" id="s-stu">—</div><div class="stat-lbl">Students Fed</div></div>
</div>

<!-- MAIN -->
<main id="main"></main>

<!-- KITCHEN TEMPLATE -->
<template id="tpl-k">
  <div class="toolbar">
    <div class="block-sel">
      <span class="blk-lbl">Meal Block / وقت کھانا</span>
      <button class="blk-btn active" data-bid="1">بنین<span class="blk-en">Boys</span></button>
      <button class="blk-btn" data-bid="2">بنات<span class="blk-en">Girls</span></button>
      <button class="blk-btn" data-bid="3">ناشتہ<span class="blk-en">B'fast</span></button>
    </div>
    <button class="add-btn" id="open-add"><span class="plus">+</span> نیا آئٹم</button>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th class="ci" rowspan="2">شے<br><span style="font-size:.56rem">ITEM</span></th>
          <th class="cu" rowspan="2">اکائی<br><span style="font-size:.56rem">UNIT</span></th>
          <th class="cn sep-l" rowspan="2">سابق<br><span style="font-size:.56rem">OPENING</span></th>
          <th colspan="2" class="gh sep-l sep-r">لد — RECEIVED</th>
          <th colspan="2" class="gh sep-l sep-r">خرچ — CONSUMED</th>
          <th class="cr sep-r" rowspan="2">باقی اسٹاک<br><span style="font-size:.56rem">REMAINING</span></th>
        </tr>
        <tr class="sh">
          <th class="cn sep-l">مقدار<br><span style="font-size:.56rem">QTY</span></th>
          <th class="cn sep-r">مالیت<br><span style="font-size:.56rem">VALUE PKR</span></th>
          <th class="cn sep-l">مقدار<br><span style="font-size:.56rem">QTY</span></th>
          <th class="cn sep-r">مالیت<br><span style="font-size:.56rem">VALUE PKR</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr>

<!-- HIJRI MODAL -->
<div class="hov" id="hov">
  <div class="hbox">
    <h3>ہجری تاریخ تبدیل کریں</h3>

<div id="toast"></div>

<script>
const API = 'http://localhost:8787';

/* ─── State ─────────────────────────────────────────────── */
let curDate   = todayISO();
let dayData   = null;
let activeBlk = 1;
let dirty     = {};      // key: `${blockId}|${itemId}` → {recv_qty,recv_value_pkr,used_qty,used_value_pkr}
let selUnit   = 'kg';
let asTimer   = null;

/* ─── Boot ───────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  renderDate();
  loadDay(curDate);
  wireGlobal();
});

/* ─── Date helpers ───────────────────────────────────────── */
function todayISO() {
  return new Date().toISOString().slice(0,10);
}
function shift(iso, d) {
  const dt = new Date(iso + 'T12:00:00');
  dt.setDate(dt.getDate() + d);
  return dt.toISOString().slice(0,10);
}
const DOW_UR = ['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];
const DOW_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function g2h(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  const jd = Math.floor((1461*(y+4800+Math.floor((m-14)/12)))/4)
           + Math.floor((367*(m-2-12*Math.floor((m-14)/12)))/12)
           - Math.floor((3*Math.floor((y+4900+Math.floor((m-14)/12))/100))/4)
           + d - 32075;
  let l = jd-1948440+10632;
  const n = Math.floor((l-1)/10631);
  l = l-10631*n+354;
  const j = Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)
           +Math.floor(l/5670)*Math.floor((43*l)/15238);
  l = l-Math.floor((30-j)/15)*Math.floor((17719*j)/50)
     -Math.floor(j/16)*Math.floor((15238*j)/43)+29;
  const hm = Math.floor((24*l)/709);
  const hd = l-Math.floor((709*hm)/24);
  const hy = 30*n+j-30;
  const MONTHS=['محرم','صفر','ربیع الاول','ربیع الثانی','جمادی الاول','جمادی الثانی',
                'رجب','شعبان','رمضان','شوال','ذوالقعدہ','ذوالحجہ'];
  const u = s => String(s).split('').map(c=>'۰۱۲۳۴۵۶۷۸۹'[+c]).join('');
  return `${u(hd)} ${MONTHS[hm-1]||''} ${u(hy)}`;
}

function renderDate() {
  const [y,m,d] = curDate.split('-');
  document.getElementById('dd').textContent = d;
  document.getElementById('dm').textContent = m;
  document.getElementById('dy').textContent = y;
  const dow = new Date(curDate+'T12:00:00').getDay();
  document.getElementById('ddow').textContent = `${DOW_EN[dow].toUpperCase()} · ${DOW_UR[dow]}`;
  document.getElementById('date-picker').value = curDate;
  const stored = dayData?.header?.hijri_date;
  document.getElementById('hijri-disp').textContent = stored || g2h(curDate);
}

/* ─── Global wire ────────────────────────────────────────── */
function wireGlobal() {
  document.getElementById('btn-prev').onclick = () => navigate(-1);
  document.getElementById('btn-next').onclick = () => navigate(1);
  document.getElementById('date-block').onclick = () =>
    document.getElementById('date-picker').showPicker?.();
  document.getElementById('date-picker').onchange = e => {
    if (!e.target.value) return;
    curDate = e.target.value; reset(); renderDate(); loadDay(curDate);
  };

  // Hijri modal
  document.getElementById('hijri-disp').onclick = e => {
    e.stopPropagation();
    document.getElementById('h-inp').value = document.getElementById('hijri-disp').textContent;
    document.getElementById('hov').classList.add('open');
  };
  document.getElementById('h-ok').onclick = () => {
    const v = document.getElementById('h-inp').value.trim();
    if (v) {
      document.getElementById('hijri-disp').textContent = v;
      if (dayData?.header) dayData.header.hijri_date = v;
    }
    document.getElementById('hov').classList.remove('open');
  };
  document.getElementById('h-cancel').onclick = () =>
    document.getElementById('hov').classList.remove('open');

  // Add item modal
  document.getElementById('close-add').onclick  = closeAdd;
  document.getElementById('btn-cancel-item').onclick = closeAdd;
  document.getElementById('ov-add').onclick = e => { if (e.target===e.currentTarget) closeAdd(); };
  document.getElementById('btn-save-item').onclick = saveItem;
  document.getElementById('unit-tog').onclick = e => {
    const b = e.target.closest('.uopt'); if (!b) return;
    document.querySelectorAll('.uopt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); selUnit = b.dataset.u;
  };
  document.getElementById('ni-ur').addEventListener('input', () => {
    clearTimeout(window._tt);
    const v = document.getElementById('ni-ur').value.trim();
    if (!v) return;
    window._tt = setTimeout(()=>autoTranslate(v), 800);
  });
}

function navigate(d) {
  curDate = shift(curDate, d); reset(); renderDate(); loadDay(curDate);
}
function reset() {
  dayData = null; dirty = {};
}

/* ─── Load day ───────────────────────────────────────────── */
async function loadDay(date) {
  showLoad();
  try {
    const r = await fetch(`${API}/api/day/${date}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    dayData = data;
    renderDate();
    if (data.exists) renderKitchen(data);
    else renderCreate(date);
  } catch(e) {
    showErr(e.message);
  }
}

function showLoad() {
  document.getElementById('main').innerHTML =
    `<div class="smsg"><div class="spin"></div>لوڈ ہو رہا ہے…</div>`;
  statsEmpty();
}
function showErr(msg) {
  document.getElementById('main').innerHTML =
    `<div class="smsg">❌ خرابی — ${msg}</div>`;
}

/* ─── Create day ─────────────────────────────────────────── */
function renderCreate(date) {
  const tpl = document.getElementById('tpl-c').content.cloneNode(true);
  document.getElementById('main').innerHTML = '';
  document.getElementById('main').appendChild(tpl);
  statsEmpty();

  document.getElementById('btn-cday').onclick = async () => {
    const stu = parseInt(document.getElementById('c-stu').value)||null;
    const btn = document.getElementById('btn-cday');
    btn.disabled=true; btn.textContent='بنایا جا رہا ہے…';
    const dow = new Date(date+'T12:00:00').getDay();
    try {
      const r = await fetch(`${API}/api/day/${date}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          action:'create_day', user_id:'ibrahim',
          hijri_date: document.getElementById('hijri-disp').textContent,
          day_of_week_ur: DOW_UR[dow],
          day_of_week_en: DOW_EN[dow],
          students_fed: stu,
        })
      });
      const data = await r.json();
      if (data.error) throw new Error(data.message||data.error);
      dayData = data;
      renderKitchen(data);
      toast('دن کامیابی سے بنایا گیا ✓');
    } catch(e) {
      toast('خرابی: '+e.message, true);
      btn.disabled=false; btn.textContent='یہ دن شروع کریں · Create Day';
    }
  };
}

/* ─── Kitchen ────────────────────────────────────────────── */
function renderKitchen(data) {
  const tpl = document.getElementById('tpl-k').content.cloneNode(true);
  document.getElementById('main').innerHTML = '';
  document.getElementById('main').appendChild(tpl);

  // Students
  const si = document.getElementById('stu-inp');
  si.value = data.header.students_fed ?? '';
  si.onchange = () => schedAS();

  // Block buttons
  activeBlk = data.blocks?.[0]?.id ?? 1;
  document.querySelectorAll('.blk-btn').forEach(b => {
    const bid = +b.dataset.bid;
    const blk = data.blocks?.find(x=>x.id===bid);
    if (blk) b.childNodes[0].textContent = blk.name_ur;
    b.onclick = () => {
      document.querySelectorAll('.blk-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      activeBlk = bid;
      renderRows(data, bid);
    };
  });

  document.getElementById('open-add').onclick = openAdd;
  document.getElementById('btn-save').onclick  = saveBlock;
  document.getElementById('btn-pdf').onclick   = () => toast('PDF رپورٹ — جلد آ رہی ہے');
  document.getElementById('btn-receipt').onclick = () => toast('رسید منسلک کریں — جلد آ رہی ہے');

  renderRows(data, activeBlk);
  statsUpdate(data);
}

/* ─── Table rows ─────────────────────────────────────────── */
function renderRows(data, blkId) {
  const tbody = document.getElementById('tbody');
  if (!tbody) return;
  tbody.innerHTML = '';

  const rows = data.rows_by_block?.[blkId] ?? [];
  const totMap = {};
  for (const t of (data.day_totals??[])) totMap[t.item_id] = t;

  let srq=0, srp=0, suq=0, sup=0;

  for (const row of rows) {
    const key  = `${blkId}|${row.item_id}`;
    const dk   = dirty[key] ?? {};
    const rq   = dk.recv_qty       ?? row.recv_qty       ?? 0;
    const rp   = dk.recv_value_pkr ?? row.recv_value_pkr ?? 0;
    const uq   = dk.used_qty       ?? row.used_qty       ?? 0;
    const up   = dk.used_value_pkr ?? row.used_value_pkr ?? 0;
    const tot  = totMap[row.item_id] ?? {};
    const open = tot.opening_qty ?? 0;
    const rem  = calcRem(tot, blkId, row.item_id, data);
    const pct  = open>0 ? Math.max(0,Math.min(100,(rem/open)*100)) : (rem>0?100:0);
    const cls  = pct<15?'low':pct<35?'med':'';
    const isls = pct<15;

    srq+=rq; srp+=rp; suq+=uq; sup+=up;

    const tr = document.createElement('tr');
    if (isls) tr.classList.add('ls');
    tr.innerHTML = `
      <td class="ci">
        <span class="iur">${row.name_ur}</span>
        <span class="ien">${row.name_en??''}</span>
      </td>
      <td class="cu"><span class="ubadge">${row.unit}</span></td>
      <td class="cn sep-l"><span class="nv">${fmt(open)}</span></td>
      <td class="cn sep-l">
        <input class="qi${rq!==(row.recv_qty??0)?' chg':''}" data-k="${key}" data-f="recv_qty"
               type="number" min="0" value="${rq||''}" placeholder="—">
      </td>
      <td class="cn sep-r">
        <input class="vi" data-k="${key}" data-f="recv_value_pkr"
               type="number" min="0" value="${rp||''}" placeholder="—">
      </td>
      <td class="cn sep-l">
        <input class="qi${uq!==(row.used_qty??0)?' chg':''}" data-k="${key}" data-f="used_qty"
               type="number" min="0" value="${uq||''}" placeholder="—">
      </td>
      <td class="cn sep-r">
        <input class="vi" data-k="${key}" data-f="used_value_pkr"
               type="number" min="0" value="${up||''}" placeholder="—">
      </td>
      <td class="cr sep-r">
        <div class="rem-cell">
          <span class="rem-qty" data-rid="${row.item_id}">${fmt(rem)}</span>
          <span class="rem-unit">${row.unit}</span>
          <div class="pb-wrap"><div class="pb-fill ${cls}" style="width:${pct}%"></div></div>
          ${isls?`<span class="ls-badge">کم · LOW</span>`:''}
        </div>
      </td>`;
    tbody.appendChild(tr);
  }

  tbody.querySelectorAll('input[data-k]').forEach(inp => {
    inp.addEventListener('input', () => {
      const k = inp.dataset.k, f = inp.dataset.f;
      dirty[k] = dirty[k] ?? {};
      dirty[k][f] = parseFloat(inp.value)||0;
      inp.classList.add('chg');
      liveRem(data, blkId);
      schedAS();
    });
  });

  const e = id => document.getElementById(id);
  e('t-rq').textContent = srq ? fmt(srq) : '—';
  e('t-rp').textContent = srp ? fmtP(srp) : '—';
  e('t-uq').textContent = suq ? fmt(suq) : '—';
  e('t-up').textContent = sup ? fmtP(sup) : '—';
}

function calcRem(tot, blkId, itemId, data) {
  let recv=0, used=0;
  for (const blk of (data.blocks??[])) {
    const brows = data.rows_by_block?.[blk.id]??[];
    const r = brows.find(x=>x.item_id===itemId);
    if (!r) continue;
    const k = `${blk.id}|${itemId}`;
    recv += dirty[k]?.recv_qty ?? r.recv_qty ?? 0;
    used += dirty[k]?.used_qty ?? r.used_qty ?? 0;
  }
  return (tot.opening_qty??0)+recv-used;
}

function liveRem(data, blkId) {
  const totMap = {};
  for (const t of (data.day_totals??[])) totMap[t.item_id]=t;
  document.querySelectorAll('[data-rid]').forEach(el => {
    const id = +el.dataset.rid;
    const tot = totMap[id]??{};
    const rem = calcRem(tot, blkId, id, data);
    el.textContent = fmt(rem);
    const op = tot.opening_qty??0;
    const pct = op>0?Math.max(0,Math.min(100,(rem/op)*100)):(rem>0?100:0);
    const fill = el.closest('td')?.querySelector('.pb-fill');
    if (fill) {
      fill.style.width = pct+'%';
      fill.className = 'pb-fill'+(pct<15?' low':pct<35?' med':'');
    }
  });
}

/* ─── Stats ──────────────────────────────────────────────── */
function statsUpdate(data) {
  let recv=0, used=0;
  for (const t of (data.day_totals??[])) {
    recv += t.recv_pkr_total??0;
    used += t.used_pkr_total??0;
  }
  document.getElementById('s-items').textContent = data.day_totals?.length??'—';
  document.getElementById('s-recv').textContent  = fmtP(recv);
  document.getElementById('s-used').textContent  = fmtP(used);
  document.getElementById('s-stu').textContent   = fmtN(data.header?.students_fed??0);
}
function statsEmpty() {
  ['s-items','s-recv','s-used','s-stu'].forEach(id=>
    document.getElementById(id).textContent='—');
}

/* ─── Save block ─────────────────────────────────────────── */
async function saveBlock() {
  if (!dayData?.exists) return;
  const rows = buildRows(activeBlk);
  if (!rows.length) { toast('کوئی تبدیلی نہیں'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='محفوظ ہو رہا ہے…';
  try {
    const r = await fetch(`${API}/api/day/${curDate}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'save_block', block_id:activeBlk,
        user_id:'ibrahim', reason_type:'correction', reason_note:'',
        rows,
      })
    });
    const data = await r.json();
    if (data.error) throw new Error(data.message||data.error);
    dayData = data;
    // Clear dirty for this block
    Object.keys(dirty).filter(k=>k.startsWith(activeBlk+'|')).forEach(k=>delete dirty[k]);
    renderRows(data, activeBlk);
    statsUpdate(data);
    setAS('محفوظ کیا گیا');
    toast('محفوظ ہو گیا ✓');
  } catch(e) {
    toast('خرابی: '+e.message, true);
  } finally {
    btn.disabled=false; btn.textContent='محفوظ کریں · SAVE';
  }
}

function buildRows(blkId) {
  const rows = dayData.rows_by_block?.[blkId]??[];
  return rows.map(row => {
    const k = `${blkId}|${row.item_id}`;
    const d = dirty[k]??{};
    return {
      item_id:        row.item_id,
      recv_qty:       d.recv_qty       ?? row.recv_qty       ?? 0,
      recv_value_pkr: d.recv_value_pkr ?? row.recv_value_pkr ?? 0,
      used_qty:       d.used_qty       ?? row.used_qty       ?? 0,
      used_value_pkr: d.used_value_pkr ?? row.used_value_pkr ?? 0,
    };
  }).filter(r => r.recv_qty||r.used_qty||r.recv_value_pkr||r.used_value_pkr||dirty[`${blkId}|${r.item_id}`]);
}

function schedAS() {
  clearTimeout(asTimer);
  setAS('غیر محفوظ تبدیلیاں…');
  asTimer = setTimeout(()=>saveBlock(), 30000);
}
function setAS(msg) {
  const el = document.getElementById('as-txt');
  if (!el) return;
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  el.textContent = `ابراہیم شاہ · ${msg} ${t}`;
}

/* ─── Add item modal ─────────────────────────────────────── */
function openAdd() {
  document.getElementById('ni-ur').value='';
  document.getElementById('ni-en').value='';
  document.getElementById('ni-en').placeholder='Auto-translating via Qwen…';
  document.getElementById('auto-tag').style.display='none';
  selUnit='kg';
  document.querySelectorAll('.uopt').forEach(b=>b.classList.toggle('sel',b.dataset.u==='kg'));
  document.getElementById('ov-add').classList.add('open');
  setTimeout(()=>document.getElementById('ni-ur').focus(),120);
}
function closeAdd() {
  document.getElementById('ov-add').classList.remove('open');
}

async function autoTranslate(urdu) {
  document.getElementById('ni-en').value='';
  document.getElementById('ni-en').placeholder='Translating via Qwen…';
  // Placeholder until POST /api/items with translation is built
  await new Promise(r=>setTimeout(r,500));
  document.getElementById('ni-en').placeholder='Translation pending (route not yet built)';
  document.getElementById('auto-tag').style.display='block';
}

async function saveItem() {
  const ur = document.getElementById('ni-ur').value.trim();
  const en = document.getElementById('ni-en').value.trim()||ur;
  if (!ur) { document.getElementById('ni-ur').focus(); return; }
  const btn = document.getElementById('btn-save-item');
  btn.disabled=true; btn.textContent='محفوظ ہو رہا ہے…';
  try {
    const r = await fetch(`${API}/api/items`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name_ur:ur, name_en:en, name_roman:en, unit:selUnit, user_id:'ibrahim'})
    });
    const data = await r.json();
    if (data.error) throw new Error(data.message||data.error);
    closeAdd();
    toast('نیا آئٹم شامل ہو گیا ✓');
    await loadDay(curDate);
  } catch(e) {
    toast('خرابی: '+e.message, true);
  } finally {
    btn.disabled=false; btn.textContent='محفوظ کریں';
  }
}

/* ─── Formatters ─────────────────────────────────────────── */
function fmt(n)  { return n==null||n===0?'0':parseFloat(n).toLocaleString('en-PK',{maximumFractionDigits:2}); }
function fmtP(n) { return n?parseFloat(n).toLocaleString('en-PK',{maximumFractionDigits:0}):'0'; }
function fmtN(n) { return (+n||0).toLocaleString('en-PK'); }

/* ─── Toast ──────────────────────────────────────────────── */
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent=msg;
  el.className='show'+(err?' err':'');
  clearTimeout(window._tt2);
  window._tt2=setTimeout(()=>{ el.className=''; },3000);
}
</script>
</body>
</html>
